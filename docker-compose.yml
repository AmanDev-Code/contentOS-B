version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contentos-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_CAROUSEL_WEBHOOK_URL=${N8N_CAROUSEL_WEBHOOK_URL}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - N8N_WORKFLOW_TIMEOUT_MS=${N8N_WORKFLOW_TIMEOUT_MS:-300000}
      - N8N_TOPICS_TIMEOUT_MS=${N8N_TOPICS_TIMEOUT_MS:-300000}
      - GENERATION_ACTIVE_STALE_MS=${GENERATION_ACTIVE_STALE_MS:-660000}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - TRENDING_ENGINE=${TRENDING_ENGINE:-playwright}
      - SCRAPER_CONCURRENCY=${SCRAPER_CONCURRENCY:-3}
      - SCRAPER_DELAY_MS=${SCRAPER_DELAY_MS:-3000}
      - SCRAPER_DEBUG_SCREENSHOTS=${SCRAPER_DEBUG_SCREENSHOTS:-false}
      - TRENDING_ALLOW_INHOUSE_FALLBACK=${TRENDING_ALLOW_INHOUSE_FALLBACK:-true}
      - TRENDING_INTERNAL_SECRET=${TRENDING_INTERNAL_SECRET}
      - WATERMARK_FREE_PLAN_ENABLED=${WATERMARK_FREE_PLAN_ENABLED:-false}
      # AI Refinement
      - AI_REFINEMENT_ENABLED=${AI_REFINEMENT_ENABLED:-true}
      - AI_REFINEMENT_BASE_URL=${AI_REFINEMENT_BASE_URL:-https://openrouter.ai/api/v1}
      - AI_REFINEMENT_MODEL=${AI_REFINEMENT_MODEL}
      - AI_REFINEMENT_FALLBACK_MODELS=${AI_REFINEMENT_FALLBACK_MODELS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_REFINEMENT_API_KEY=${AI_REFINEMENT_API_KEY}
      - AI_REFINEMENT_TIMEOUT_MS=${AI_REFINEMENT_TIMEOUT_MS:-12000}
      - AI_REFINEMENT_REFERER=${AI_REFINEMENT_REFERER}
      - AI_REFINEMENT_APP_TITLE=${AI_REFINEMENT_APP_TITLE}
      # Polar Payment
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
      - POLAR_ORGANIZATION=${POLAR_ORGANIZATION}
      - POLAR_ENV=${POLAR_ENV:-sandbox}
      - POLAR_PRODUCT_STANDARD_MONTHLY=${POLAR_PRODUCT_STANDARD_MONTHLY}
      - POLAR_PRODUCT_STANDARD_YEARLY=${POLAR_PRODUCT_STANDARD_YEARLY}
      - POLAR_PRODUCT_PRO_MONTHLY=${POLAR_PRODUCT_PRO_MONTHLY}
      - POLAR_PRODUCT_PRO_YEARLY=${POLAR_PRODUCT_PRO_YEARLY}
      - POLAR_PRODUCT_ULTIMATE_MONTHLY=${POLAR_PRODUCT_ULTIMATE_MONTHLY}
      - POLAR_PRODUCT_ULTIMATE_YEARLY=${POLAR_PRODUCT_ULTIMATE_YEARLY}
      - POLAR_PRICE_STANDARD_MONTHLY=${POLAR_PRICE_STANDARD_MONTHLY}
      - POLAR_PRICE_STANDARD_YEARLY=${POLAR_PRICE_STANDARD_YEARLY}
      - POLAR_PRICE_PRO_MONTHLY=${POLAR_PRICE_PRO_MONTHLY}
      - POLAR_PRICE_PRO_YEARLY=${POLAR_PRICE_PRO_YEARLY}
      - POLAR_PRICE_ULTIMATE_MONTHLY=${POLAR_PRICE_ULTIMATE_MONTHLY}
      - POLAR_PRICE_ULTIMATE_YEARLY=${POLAR_PRICE_ULTIMATE_YEARLY}
      # OpenAI (for custom topic generation and carousel rendering)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CUSTOM_TOPIC_MODEL=${CUSTOM_TOPIC_MODEL}
      - CUSTOM_TOPIC_CAROUSEL_MODEL=${CUSTOM_TOPIC_CAROUSEL_MODEL}
      # Platform auth/session cookies (optional)
      - INSTAGRAM_SESSION=${INSTAGRAM_SESSION}
      - INSTAGRAM_CSRFTOKEN=${INSTAGRAM_CSRFTOKEN}
      - INSTAGRAM_DS_USER_ID=${INSTAGRAM_DS_USER_ID}
      - INSTAGRAM_IG_DID=${INSTAGRAM_IG_DID}
      - INSTAGRAM_MID=${INSTAGRAM_MID}
      - LINKEDIN_COOKIE=${LINKEDIN_COOKIE}
      - X_AUTH_TOKEN=${X_AUTH_TOKEN}
      # Forex/Currency Exchange API
      - FOREX_API_KEY=${FOREX_API_KEY}
      - FOREX_API_BASE_URL=${FOREX_API_BASE_URL:-https://forex-aws.silverlining.cloud}
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: contentos-dragonfly
    ports:
      - "6380:6379"
    volumes:
      - dragonfly-data:/data
    command: --logtostderr --lua_auto_async=true --default_lua_flags=allow-undeclared-keys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: contentos-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  dragonfly-data:
  minio-data:
